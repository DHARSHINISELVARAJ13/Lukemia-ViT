<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clipboard Image Paste</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: transparent;
      color: #e2e8f0;
      padding: 2px;
      overflow: hidden;
    }
    .paste-container {
      background: rgba(30, 41, 59, 0.7);
      border: 2px dashed #475569;
      border-radius: 10px;
      padding: 16px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      outline: none;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 145px;
      box-sizing: border-box;
    }
    .paste-container:hover {
      border-color: #3b82f6;
      background: rgba(30, 41, 59, 0.9);
    }
    .paste-container:focus, .paste-container.active-focus {
      border-color: #3b82f6;
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }
    .icon-wrapper {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60a5fa;
    }
    .paste-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.2px;
    }
    .paste-instruction {
      font-size: 12px;
      color: #94a3b8;
    }
    .paste-instruction strong {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.15);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid rgba(59, 130, 246, 0.3);
      font-family: monospace;
      font-size: 11px;
    }
    .paste-btn-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }
    .btn-paste {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn-paste:hover {
      background: #1d4ed8;
    }
    .btn-paste:active {
      background: #1e40af;
    }
    .paste-status {
      font-size: 11px;
      margin-top: 2px;
      min-height: 16px;
      font-weight: 500;
    }
    .status-success { color: #34d399; }
    .status-error { color: #f87171; }
    .status-info { color: #94a3b8; }
  </style>
</head>
<body>
  <div id="paste-box" class="paste-container" tabindex="0" role="button" aria-label="Paste image from clipboard">
    <div class="icon-wrapper">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
      </svg>
    </div>
    <div class="paste-instruction">Paste an image from your clipboard or press <strong>Ctrl + V</strong></div>
    <div class="paste-btn-row">
      <button type="button" id="btn-click-paste" class="btn-paste">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
        <span>Paste from Clipboard</span>
      </button>
    </div>
    <div id="status-msg" class="paste-status status-info">Supports PNG, JPG, JPEG, WEBP</div>
  </div>

  <script>
    // Streamlit Component Messaging API
    function sendMessage(type, data) {
      const outData = Object.assign({
        isStreamlitMessage: true,
        type: type,
      }, data);
      window.parent.postMessage(outData, "*");
    }

    const Streamlit = {
      setComponentReady: function() {
        sendMessage("streamlit:componentReady", { apiVersion: 1 });
      },
      setFrameHeight: function(height) {
        sendMessage("streamlit:setFrameHeight", { height: height });
      },
      setComponentValue: function(value) {
        sendMessage("streamlit:setComponentValue", { value: value });
      }
    };

    const pasteBox = document.getElementById("paste-box");
    const statusMsg = document.getElementById("status-msg");
    const clickPasteBtn = document.getElementById("btn-click-paste");

    function setStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = "paste-status status-" + type;
    }

    function notifyHeight() {
      const height = document.body.scrollHeight || 160;
      Streamlit.setFrameHeight(height + 4);
    }

    // Process a valid image Blob/File
    function processImageBlob(blob, filename) {
      if (!blob.type || (!blob.type.startsWith("image/") && blob.type !== "application/octet-stream")) {
        setStatus("The clipboard contains an unsupported image format. Please paste a PNG or JPEG image, or upload the file.", "error");
        Streamlit.setComponentValue({
          status: "error",
          error_type: "unsupported_format",
          message: "The clipboard contains an unsupported image format. Please paste a PNG or JPEG image, or upload the file."
        });
        return;
      }

      setStatus("Reading clipboard image data...", "info");
      const reader = new FileReader();

      reader.onload = function(e) {
        const dataUrl = e.target.result;
        setStatus("Image ready — running prediction...", "success");
        Streamlit.setComponentValue({
          status: "success",
          data_url: dataUrl,
          mime_type: blob.type || "image/png",
          file_size: blob.size,
          filename: filename || "clipboard_image.png",
          timestamp: Date.now()
        });
      };

      reader.onerror = function() {
        setStatus("The clipboard contains an unsupported image format. Please paste a PNG or JPEG image, or upload the file.", "error");
        Streamlit.setComponentValue({
          status: "error",
          error_type: "read_error",
          message: "The clipboard contains an unsupported image format. Please paste a PNG or JPEG image, or upload the file."
        });
      };

      reader.readAsDataURL(blob);
    }

    // Handle paste event (Ctrl + V)
    function handlePasteEvent(e) {
      const clipboardData = e.clipboardData || (window.clipboardData);
      if (!clipboardData) return;

      const items = clipboardData.items;
      if (!items || items.length === 0) {
        setStatus("No image was found in the clipboard. Copy an image and try again.", "error");
        Streamlit.setComponentValue({
          status: "error",
          error_type: "no_image",
          message: "No image was found in the clipboard. Copy an image and try again."
        });
        return;
      }

      let foundImage = false;
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (item.type.indexOf("image") !== -1) {
          const file = item.getAsFile();
          if (file) {
            foundImage = true;
            processImageBlob(file, file.name || "clipboard_image.png");
            e.preventDefault();
            break;
          }
        }
      }

      if (!foundImage) {
        // Check if only text was pasted
        let hasText = false;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf("text") !== -1) {
            hasText = true;
            break;
          }
        }
        if (hasText) {
          setStatus("No image was found in the clipboard. Copy an image and try again.", "error");
          Streamlit.setComponentValue({
            status: "error",
            error_type: "text_only",
            message: "No image was found in the clipboard. Copy an image and try again."
          });
          e.preventDefault();
        }
      }
    }

    // Listen to paste on current window and box
    window.addEventListener("paste", handlePasteEvent);
    pasteBox.addEventListener("paste", handlePasteEvent);

    // Also attempt listening to parent window paste event if same-origin
    try {
      if (window.parent && window.parent.document) {
        window.parent.document.addEventListener("paste", handlePasteEvent);
      }
    } catch (crossOriginErr) {
      // Cross-origin fallback: pasteBox focus handles Ctrl+V
    }

    // Handle Click on Button (Async Clipboard API)
    clickPasteBtn.addEventListener("click", async function(e) {
      e.stopPropagation();
      pasteBox.focus();

      if (!navigator.clipboard || !navigator.clipboard.read) {
        setStatus("Clipboard access unavailable. Please click inside the box and press Ctrl + V.", "info");
        Streamlit.setComponentValue({
          status: "error",
          error_type: "permission_denied",
          message: "Clipboard image could not be accessed. Please use Ctrl + V inside the clipboard input area, or upload the image using the file uploader."
        });
        return;
      }

      try {
        const clipboardItems = await navigator.clipboard.read();
        let foundImage = false;

        for (const item of clipboardItems) {
          for (const type of item.types) {
            if (type.startsWith("image/")) {
              const blob = await item.getType(type);
              foundImage = true;
              processImageBlob(blob, "clipboard_image." + (type.split("/")[1] || "png"));
              return;
            }
          }
        }

        if (!foundImage) {
          setStatus("No image was found in the clipboard. Copy an image and try again.", "error");
          Streamlit.setComponentValue({
            status: "error",
            error_type: "no_image",
            message: "No image was found in the clipboard. Copy an image and try again."
          });
        }
      } catch (err) {
        setStatus("Clipboard image could not be accessed. Please use Ctrl + V inside the clipboard area.", "info");
        Streamlit.setComponentValue({
          status: "error",
          error_type: "permission_denied",
          message: "Clipboard image could not be accessed. Please use Ctrl + V inside the clipboard input area, or upload the image using the file uploader."
        });
      }
    });

    // Notify ready and set initial height
    window.addEventListener("load", function() {
      Streamlit.setComponentReady();
      notifyHeight();
    });
    window.addEventListener("resize", notifyHeight);
    setTimeout(notifyHeight, 200);
  </script>
</body>
</html>
